[project]
name = "verificacao-localidades"
version = "0.1.0"
description = "Verificação de caixa-preta do contrato de localidades (E1 e E4), com um IBGE falso controlável."
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "pyyaml>=6",
    "openapi-spec-validator>=0.7",
]

[project.scripts]
ibge-falso = "ibge_falso.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibge_falso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
