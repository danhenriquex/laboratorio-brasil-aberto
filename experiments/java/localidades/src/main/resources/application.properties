# E4 — Serviço de localidades (IBGE). Decisões em specs/003-localidades-java/research.md.

# Configuração comum ao E1 e ao E4 (contracts/localidades/README.md). O mapeamento é explícito porque o
# relaxed binding do Spring trataria cada "_" da variável de ambiente como separador de nível (R10).
localidades.ibge-url=${LOCALIDADES_IBGE_URL:https://servicodados.ibge.gov.br/api/v1/localidades}
localidades.prazo-fonte-s=${LOCALIDADES_PRAZO_FONTE_S:10}
localidades.validade-s=${LOCALIDADES_VALIDADE_S:86400}
localidades.itens-max=${LOCALIDADES_ITENS_MAX:500}
server.address=${LOCALIDADES_HOST:127.0.0.1}
server.port=${LOCALIDADES_PORTA:8000}

spring.application.name=localidades
spring.main.banner-mode=off
# Spring MVC em threads virtuais (R2).
spring.threads.virtual.enabled=true

# Erros: nunca expor rastro de execução nem a página de erro padrão (FR-013).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# Actuator só para a autoconfiguração do Micrometer; /health e /metrics são controllers próprios (R8).
management.endpoints.access.default=none
management.endpoints.web.exposure.exclude=*

# Só avisos e erros do framework; o registro de pedidos tem logger próprio (R9).
logging.level.root=WARN
