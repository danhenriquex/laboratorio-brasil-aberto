[project]
name = "inventario-fontes"
version = "0.1.0"
description = "E0 — inventário e conectividade das fontes públicas brasileiras do catálogo do laboratório."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
inventario = "inventario_fontes.cli:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "jsonschema>=4.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventario_fontes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
