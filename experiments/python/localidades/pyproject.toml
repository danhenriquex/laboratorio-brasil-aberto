[project]
name = "localidades-ibge"
version = "0.1.0"
description = "E1 — serviço de localidades sobre a API do IBGE, com contrato, procedência, cache e erros padronizados."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.scripts]
localidades = "localidades.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localidades"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# O Starlette 1.x recomenda o pacote httpx2 no TestClient; o aviso não afeta os testes.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
